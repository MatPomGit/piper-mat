name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile project scripts
        run: python -m compileall -q scripts

      - name: Check repository structure and voice config
        run: python scripts/check_project.py

      - name: Validate canonical training command
        run: python scripts/train_voice.py --dry-run

      - name: Record experiment environment
        run: |
          python scripts/record_environment.py --output /tmp/environment.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/environment.json', encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['inputs']['config']['sha256']
          assert data['inputs']['metadata']['sha256']
          PY

      - name: Validate dataset metadata
        run: |
          python scripts/validate_dataset.py \
            --metadata dataset/metadata.csv \
            --audio-dir dataset/wavs \
            --skip-audio

      - name: Verify deterministic dataset split generation
        run: |
          python scripts/create_splits.py --output /tmp/splits-a.json
          python scripts/create_splits.py --output /tmp/splits-b.json
          cmp /tmp/splits-a.json /tmp/splits-b.json

      - name: Verify checkpoint manifest and LFS pointer
        run: python scripts/verify_checkpoint.py checkpoints/base.ckpt

      - name: Verify Polish regression corpus
        run: |
          test -s tests/polish_sentences.txt
          grep -q 'Zażółć gęślą jaźń' tests/polish_sentences.txt
          grep -q '31 sierpnia 2026' tests/polish_sentences.txt

      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Test Polish phonemization
        run: python scripts/test_polish_phonemization.py

      - name: Self-test WER and CER evaluator
        run: |
          printf '%s\n' \
            '{"reference":"Ala ma kota","hypothesis":"Ala ma kota"}' \
            > /tmp/transcripts.jsonl
          python scripts/evaluate_transcripts.py /tmp/transcripts.jsonl --output /tmp/metrics.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/metrics.json', encoding='utf-8'))
          assert data['wer'] == 0.0
          assert data['cer'] == 0.0
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: python -m pip install 'mkdocs>=1.6,<2'

      - name: Build documentation
        run: mkdocs build --strict
