name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile project scripts
        run: python -m compileall -q scripts

      - name: Check repository structure and voice config
        run: python scripts/check_project.py

      - name: Validate dataset metadata
        run: |
          python scripts/validate_dataset.py \
            --metadata dataset/metadata.csv \
            --audio-dir dataset/wavs \
            --skip-audio

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: python -m pip install 'mkdocs>=1.6,<2'

      - name: Build documentation
        run: mkdocs build --strict
